plugins {
    id 'com.android.library'
}

android {
    namespace = 'org.cocos2dx.lib'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
    }

    sourceSets.main {
        java.srcDirs += "../java/src"
        manifest.srcFile "AndroidManifest.xml"
    }

    buildTypes {
        release {
            // Classes here are looked up by name from C++ via JNI; shrinking breaks them.
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation fileTree(dir: '../java/libs', include: ['*.jar'])
}
